name: Daily Restaurant Ratings Tracker

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI and external schedulers (cron-job.org)

permissions:
  contents: write

jobs:
  track-and-mail:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Ratings Tracker and Mailer
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT || 'vsaiteja@isthara.com' }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          python main.py --run-now

      - name: Commit and Push Updated Excel Sheet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/restaurant_ratings.xlsx
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update daily restaurant ratings [skip ci]" && git pull --rebase && git push)
